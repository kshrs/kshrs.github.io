<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Kishor's blog – ML, systems, programming notes">
    <title>kshrs · blog</title>
    <link rel="icon" type="image/png" sizes="32x32" href="../assets/moon.png">
    <link rel="stylesheet" href="../style.css">
    <style>
        /* additional list styling */
        .blog-list {
            margin-top: 1rem;
        }
        .blog-entry {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: baseline;
            padding: 0.75rem 0;
            border-bottom: 1px solid var(--border-subtle);
            font-family: var(--font-ui);
            font-size: 0.9rem;
        }
        .blog-entry a {
            font-size: 1rem;
            font-weight: 500;
            border-bottom: none;
        }
        .blog-date {
            color: var(--text-secondary);
            font-size: 0.8rem;
        }
        @media (max-width: 600px) {
            .blog-entry {
                flex-direction: column;
                gap: 0.25rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <nav class="nav-top">
            <a href="../index.html">~/home</a>
            <a href="./index.html" class="active">~/blogs</a>
            <a href="../assets/Kishor_S_Resume_General.pdf" target="_blank">~/resume.pdf</a>
        </nav>

        <header class="info">
            <div class="heading">
                <h1>blogs<span class="prompt-cursor"></span></h1>
                <img src="../assets/moon.jpg" alt="moon" class="avatar">
            </div>
            <h2 class="tagline">notes · research · code</h2>
        </header>

        <span class="ruler"></span>

        <div id="blog-list-container" class="blog-list">
            <p>loading entries...</p>
        </div>


        <div class="contact-footnote">
            <p>← <a href="../index.html">home</a> &nbsp;|&nbsp; <a href="mailto:kishorjsk2006@gmail.com">email</a></p>
        </div>
    </div>

    <script>
        fetch('./blogs.json')
            .then(res => res.json())
            .then(blogs => {
                const container = document.getElementById('blog-list-container');
                container.innerHTML = '';
                if (!blogs.length) {
                    container.innerHTML = '<p>no posts yet — check back soon.</p>';
                    return;
                }
                // sort by date descending (newest first)
                blogs.sort((a,b) => new Date(b.date) - new Date(a.date));
                blogs.forEach(blog => {
                    const entry = document.createElement('div');
                    entry.className = 'blog-entry';
                    entry.innerHTML = `
                        <div><a href="${blog.file}">${blog.title}</a></div>
                        <div class="blog-date">${blog.date}</div>
                    `;
                    container.appendChild(entry);
                });
            })
            .catch(err => {
                document.getElementById('blog-list-container').innerHTML = '<p>could not load blog index.</p>';
                console.error(err);
            });
    </script>
</body>
</html>
